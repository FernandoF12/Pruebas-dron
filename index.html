<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulas - Parque Aconcagua</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
      font-family: system-ui, -apple-system, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Contenedor de la botonera en la parte inferior */
    .ui-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 16px;
      border-radius: 30px;
      backdrop-filter: blur(8px);
      z-index: 10;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* Estilos de los botones */
    .btn {
      background: #222222;
      color: #ffffff;
      border: 1px solid #444444;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #333333;
      border-color: #666666;
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <model-viewer
    id="dron-viewer"
    alt="Captura 3D por dron - Mulas Parque Aconcagua"
    src="example/odm_textured_model_geo.glb"
    poster="example/loading.webp"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    ar
    max-camera-orbit="360deg 90deg auto"
    min-field-of-view="10deg"
    max-field-of-view="90deg">

    <!-- Botonera superpuesta sobre el modelo -->
    <div class="ui-controls">
      <button class="btn" id="btn-reset">Reiniciar Vista</button>
      <button class="btn" id="btn-rotate">Pausar Rotación</button>
      <button class="btn" id="btn-ar">Ver en AR</button>
    </div>

  </model-viewer>

  <script>
    const viewer = document.getElementById('dron-viewer');
    const btnReset = document.getElementById('btn-reset');
    const btnRotate = document.getElementById('btn-rotate');
    const btnAr = document.getElementById('btn-ar');

    // 1. Reiniciar la cámara a su posición inicial
    btnReset.addEventListener('click', () => {
      viewer.cameraControls = true;
      viewer.cameraTarget = "auto auto auto";
      viewer.cameraOrbit = "0deg 75deg auto";
    });

    // 2. Activar o desactivar la rotación automática
    btnRotate.addEventListener('click', () => {
      viewer.autoRotate = !viewer.autoRotate;
      btnRotate.textContent = viewer.autoRotate ? 'Pausar Rotación' : 'Activar Rotación';
    });

    // 3. Activar el modo de Realidad Aumentada (en móviles soportados)
    btnAr.addEventListener('click', () => {
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        alert('La realidad aumentada no está disponible en este dispositivo/navegador.');
      }
    });
  </script>

</body>
</html>
