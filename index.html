<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aconcagua - Mapa 3D Dron</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Contenedor del Mapa Satelital */
    #mapa {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* Ventana Modal para el Visor 3D */
    .modal-3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none; /* Oculto por defecto */
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-3d.active {
      display: flex;
    }

    .modal-contenido {
      position: relative;
      width: 90%;
      height: 85%;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Botón para cerrar la modal */
    .btn-cerrar {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      font-size: 20px;
      padding: 8px 16px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      backdrop-filter: blur(5px);
    }

    .btn-cerrar:hover {
      background: rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body>

  <!-- Mapa Satelital -->
  <div id="mapa"></div>

  <!-- Modal 3D superpuesto -->
  <div class="modal-3d" id="modal-visor">
    <div class="modal-contenido">
      <button class="btn-cerrar" id="btn-cerrar">&times;</button>
      <model-viewer
        id="visor-3d"
        src=""
        alt="Modelo 3D Dron"
        camera-controls
        auto-rotate
        ar>
      </model-viewer>
    </div>
  </div>

  <script>
    // 1. Inicializar el mapa centrado en el Parque Aconcagua (Lat, Lng, Zoom)
    const mapa = L.map('mapa').setView([-32.6532, -70.0108], 12);

    // 2. Capa Satelital Gratuita (Esri World Imagery)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    }).addTo(mapa);

    // 3. Datos de los campamentos con sus archivos GLB
    const campamentos = [
      {
        nombre: "Plaza de Mulas",
        lat: -32.649588,
        lng: -70.057450,
        glb: "example/odm_textured_model_geo.glb"
      },
      {
        nombre: "Confluencia",
        lat: -32.7212,
        lng: -69.9324,
        glb: "example/confluencia.glb"
      }
    ];

    // Elementos del DOM
    const modal = document.getElementById('modal-visor');
    const visor = document.getElementById('visor-3d');
    const btnCerrar = document.getElementById('btn-cerrar');

    // 4. Crear marcadores en el mapa para cada campamento
    campamentos.forEach(camp => {
      const marcador = L.marker([camp.lat, camp.lng]).addTo(mapa);
      
      // Popup explicativo al hacer clic en el marcador
      const contenidoPopup = `
        <div style="text-align: center;">
          <h3 style="margin: 0 0 8px 0;">${camp.nombre}</h3>
          <button onclick="abrirModelo('${camp.glb}')" style="background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">
            Ver Fotogrametría 3D
          </button>
        </div>
      `;
      
      marcador.bindPopup(contenidoPopup);
    });

    // 5. Función para abrir la ventana modal y cargar el archivo GLB correspondiente
    function abrirModelo(rutaGlb) {
      visor.src = rutaGlb;
      modal.classList.add('active');
    }

    // 6. Cerrar modal y limpiar el visor para no consumir memoria GPU
    btnCerrar.addEventListener('click', () => {
      modal.classList.remove('active');
      visor.src = ""; 
    });
  </script>

</body>
</html>
