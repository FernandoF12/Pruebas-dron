<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aconcagua - Senderos y Fotogrametría 3D</title>

  <!-- Leaflet CSS y JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Plugin para leer archivos GPX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

  <!-- Google Model Viewer para los archivos GLB -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background-color: #111;
    }

    /* Mapa a pantalla completa */
    #mapa {
      width: 100%;
      height: 100vh;
      z-index: 1;
    }

    /* Modal emergente para el visor 3D */
    .modal-3d {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
    }

    .modal-3d.active {
      display: flex;
    }

    .modal-contenido {
      position: relative;
      width: 90%;
      height: 85%;
      background: #111111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border: 1px solid #333;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Botón flotante para cerrar la modal */
    .btn-cerrar {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: none;
      font-size: 24px;
      line-height: 1;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .btn-cerrar:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    /* Botón dentro del Popup de Leaflet */
    .btn-popup {
      background: #007bff;
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      margin-top: 6px;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-popup:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <!-- Contenedor del mapa -->
  <div id="mapa"></div>

  <!-- Modal superpuesta para renderizar el modelo 3D -->
  <div class="modal-3d" id="modal-visor">
    <div class="modal-contenido">
      <button class="btn-cerrar" id="btn-cerrar" aria-label="Cerrar visor 3D">&times;</button>
      <model-viewer
        id="visor-3d"
        src=""
        alt="Modelo 3D de captura por dron"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        ar
        max-camera-orbit="360deg 90deg auto"
        min-field-of-view="10deg"
        max-field-of-view="90deg">
      </model-viewer>
    </div>
  </div>

  <script>
    // 1. Inicializar el mapa centrado en el Aconcagua
    const mapa = L.map('mapa').setView([-32.6532, -70.0108], 11);

    // 2. Capa de imágenes satelitales (Esri World Imagery)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Fuente: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, y la comunidad GIS'
    }).addTo(mapa);

    // 3. Carga del archivo GPX descargado
    // Asegúrate de colocar tu archivo GPX en la ruta correcta
    const gpxUrl = 'example/sendero_aconcagua.gpx'; 

    new L.GPX(gpxUrl, {
      async: true,
      polyline_options: {
        color: '#ffea00', // Color amarillo de alto contraste
        weight: 5,        // Ancho de la línea en píxeles
        opacity: 0.85
      }
    }).on('loaded', function(e) {
      // Ajusta el encuadre del mapa a toda la extensión de la ruta cargada
      mapa.fitBounds(e.target.getBounds());
    }).on('error', function(e) {
      console.warn('No se pudo cargar el archivo GPX o la ruta es inválida. Verifica la ruta:', gpxUrl);
    }).addTo(mapa);

    // 4. Lista de campamentos con marcadores y sus archivos GLB
    const campamentos = [
      {
        nombre: "Plaza de Mulas",
        lat: -32.649978,
        lng: -70.057150,
        glb: "example/odm_textured_model_geo.glb"
      },
      {
        nombre: "Confluencia",
        lat: -32.758516, 
        lng: -69.967109,
        glb: "example/confluencia.glb"
      }
    ];

    // Elementos del DOM para la modal
    const modal = document.getElementById('modal-visor');
    const visor = document.getElementById('visor-3d');
    const btnCerrar = document.getElementById('btn-cerrar');

    // 5. Renderizar los marcadores en el mapa
    campamentos.forEach(camp => {
      const marcador = L.marker([camp.lat, camp.lng]).addTo(mapa);
      
      const popupContenido = `
        <div style="text-align: center; min-width: 140px;">
          <h4 style="margin: 0 0 6px 0; color: #111;">${camp.nombre}</h4>
          <button class="btn-popup" onclick="abrirModelo('${camp.glb}')">
            Ver Fotogrametría 3D
          </button>
        </div>
      `;
      
      marcador.bindPopup(popupContenido);
    });

    // 6. Abrir la modal y asignar la ruta del modelo GLB
    function abrirModelo(rutaGlb) {
      visor.src = rutaGlb;
      modal.classList.add('active');
    }

    // 7. Cerrar la modal y liberar recursos de la GPU
    btnCerrar.addEventListener('click', () => {
      modal.classList.remove('active');
      visor.src = ""; 
    });

    // Cerrar también si el usuario hace clic fuera del contenido 3D
    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        modal.classList.remove('active');
        visor.src = "";
      }
    });
  </script>

</body>
</html>
