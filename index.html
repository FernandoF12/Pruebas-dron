<HTML
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Viewport esencial para responsividad en móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mulas - Parque Aconcagua</title>

  <!-- Importación de Model-Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #111111;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      display: block;
      /* Evita parpadeos mientras se carga el poster */
      --poster-color: transparent; 
    }
  </style>
</head>

<body>
  <main>
    <model-viewer
      alt="Captura 3D por dron del área Mulas en el Parque Aconcagua"
      src="example/odm_textured_model_geo.glb"
      poster="example/loading.webp"
      loading="eager"
      reveal="auto"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      shadow-intensity="1"
      shadow-softness="1"
      exposure="1"
      ar
      ar-modes="webxr scene-viewer quick-look"
      max-camera-orbit="360deg 180deg auto"
      min-field-of-view="10deg"
      max-field-of-view="90deg">
    </model-viewer>
  </main>
</body>
</html>
